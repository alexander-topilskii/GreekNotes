<!DOCTYPE html>
<html lang="ru" class="h-full overflow-hidden">
<head>
  <meta charset="UTF-8">

  <title>Греческий язык — Недвижимость, город, глаголы</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Strict 100vh viewport clamp - absolutely no window scroll */
    html, body {
      height: 100vh;
      height: 100dvh;
      max-height: 100vh;
      max-height: 100dvh;
      width: 100vw;
      overflow: hidden !important;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    :root {
      --app-font-size: 11px;
      --app-line-height: 1.25;
      --row-py: 1px;
      --card-gap: 5px;
    }

    /* Outer container taking exact remaining screen space */
    #viewport-container {
      height: calc(100dvh - 38px);
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 4px;
      box-sizing: border-box;
      position: relative;
    }

    /* The scalable canvas wrapper */
    #scale-stage {
      width: 100%;
      height: 100%;
      transform-origin: top center;
      transition: transform 0.12s ease-out;
      display: flex;
      flex-direction: column;
    }

    /* 5 balanced columns flex grid */
    .sheet-columns {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 5px;
      width: 100%;
      height: 100%;
      align-items: stretch;
    }

    .col-stack {
      display: flex;
      flex-direction: column;
      gap: var(--card-gap);
      min-width: 0;
      height: 100%;
    }

    .vocab-card {
      font-size: var(--app-font-size);
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 5px;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.03);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .vocab-card-header {
      padding: 2px 6px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      line-height: 1.2;
      flex-shrink: 0;
    }

    .vocab-row {
      padding: var(--row-py) 6px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 4px;
      line-height: var(--app-line-height);
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
      transition: background-color 0.1s ease;
    }

    .vocab-row:last-child {
      border-bottom: none;
    }

    .vocab-row:hover {
      background-color: #f0f9ff;
    }

    /* Subtle gender-based article coloring */
    .art-neu { color: #0284c7; font-weight: 600; }
    .art-fem { color: #e11d48; font-weight: 600; }
    .art-masc { color: #059669; font-weight: 600; }

    /* Test mode translation blur */
    body.test-mode .ru-translation {
      filter: blur(4.5px);
      transition: filter 0.15s ease;
      cursor: pointer;
    }
    body.test-mode .ru-translation:hover,
    body.test-mode .ru-translation:active {
      filter: blur(0);
    }

    /* Print styles strictly tailored for 1 page A4 landscape */
    @page {
      size: A4 landscape;
      margin: 4mm 5mm;
    }

    @media print {
      html, body {
        height: auto !important;
        overflow: visible !important;
        background: #ffffff !important;
        color: #000000 !important;
        font-size: 7pt !important;
      }

      #screen-header,
      .no-print,
      .audio-btn {
        display: none !important;
      }

      #print-banner {
        display: flex !important;
        justify-content: space-between;
        align-items: baseline;
        border-bottom: 1.2px solid #0f172a;
        padding-bottom: 1px;
        margin-bottom: 3px;
      }

      #viewport-container {
        height: auto !important;
        width: 100% !important;
        padding: 0 !important;
        overflow: visible !important;
      }

      #scale-stage {
        transform: none !important;
        width: 100% !important;
        height: auto !important;
      }

      .sheet-columns {
        display: grid !important;
        grid-template-columns: repeat(5, 1fr) !important;
        gap: 2.5mm !important;
        height: auto !important;
      }

      .vocab-card {
        border: 0.5pt solid #cbd5e1 !important;
        border-radius: 3px !important;
        box-shadow: none !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        font-size: 6.8pt !important;
        margin-bottom: 2mm !important;
      }

      .vocab-card-header {
        background: #f1f5f9 !important;
        padding: 1px 3px !important;
        border-bottom: 0.5pt solid #cbd5e1 !important;
      }

      .vocab-row {
        padding: 0.6px 3px !important;
        border-bottom: 0.5pt solid #f1f5f9 !important;
      }

      .ru-translation {
        filter: none !important;
        color: #334155 !important;
      }
    }
  </style>
</head>

          { el: "ψάχνω (για)", ru: "искать" },
          { el: "νοικιάζω", ru: "снимать / сдавать" },
          { el: "μετακομίζω", ru: "переезжать" },
          { el: "στρίβω", ru: "поворачивать" },
          { el: "προχωράω / περπατάω", ru: "идти вперед / пешком" },
          { el: "περνάω (απέναντι)", ru: "переходить дорогу" },
          { el: "βρίσκω / βρίσκεται", ru: "находить / находится" },
          { el: "κοστίζει", ru: "стоит (по цене)" },
          { el: "διαλέγω", ru: "выбирать" }
        ]
      }
    ];

    // State Variables
    let speechRate = 0.9;
    let manualScaleMultiplier = 1.0;
    let isAutoFitActive = true;
    let searchQuery = '';
    const speedCycle = [0.7, 0.9, 1.0];

    // Format Greek articles
    function formatGreek(text) {
      return text.replace(/^(το|τα|η|οι|ο)\s+/i, (match, art) => {
        const lower = art.toLowerCase();
        let cls = 'art-neu';
        if (lower === 'η' || lower === 'οι') cls = 'art-fem';
        else if (lower === 'ο') cls = 'art-masc';
        return `<span class="${cls}">${art}</span> `;
      });
    }

    // Text to Speech
    function speak(text, e) {
      if (e) e.stopPropagation();
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const clean = text.replace(/\(.*?\)/g, '').replace(/\/.*/, '').trim();
      const utter = new SpeechSynthesisUtterance(clean);
      utter.lang = 'el-GR';
      utter.rate = speechRate;
      window.speechSynthesis.speak(utter);
    }

    function cycleSpeed() {
      const idx = speedCycle.indexOf(speechRate);
      speechRate = speedCycle[(idx + 1) % speedCycle.length];
      document.getElementById('speedValue').innerText = speechRate + 'x';
    }

    function toggleTestMode() {
      const isTest = document.body.classList.toggle('test-mode');
      document.getElementById('testIcon').innerText = isTest ? '🙈' : '👁️';
      document.getElementById('testLabel').innerText = isTest ? 'Ответы' : 'Тест';
    }

    function toggleAutoFit() {
      isAutoFitActive = !isAutoFitActive;
      const btn = document.getElementById('autoFitBtn');
      if (isAutoFitActive) {
        btn.className = "px-2 py-0.5 rounded text-[11px] font-semibold border border-sky-300 bg-sky-50 text-sky-700 hover:bg-sky-100 flex items-center gap-1 shadow-2xs";
        manualScaleMultiplier = 1.0;
      } else {
        btn.className = "px-2 py-0.5 rounded text-[11px] font-medium border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 flex items-center gap-1";
      }
      fitViewport();
    }

    function adjustScale(delta) {
      isAutoFitActive = false;
      document.getElementById('autoFitBtn').className = "px-2 py-0.5 rounded text-[11px] font-medium border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 flex items-center gap-1";
      manualScaleMultiplier = Math.max(0.65, Math.min(1.4, manualScaleMultiplier + delta));
      fitViewport();
    }

    // Auto-fit Engine that guarantees 100vh fit without scrollbars
    function fitViewport() {
      const container = document.getElementById('viewport-container');
      const stage = document.getElementById('scale-stage');
      const columnsContainer = document.getElementById('columnsContainer');
      if (!container || !stage || !columnsContainer) return;

      // Reset transform before measuring natural scroll dimensions
      stage.style.transform = 'scale(1)';

      const availH = container.clientHeight;
      const availW = container.clientWidth;
      const neededH = columnsContainer.scrollHeight;
      const neededW = columnsContainer.scrollWidth;

      if (availH <= 0 || neededH <= 0) return;

      let targetScale = 1;
      if (isAutoFitActive) {
        // Calculate factor needed to fit exactly within visible height and width
        const scaleH = (availH - 8) / neededH;
        const scaleW = availW / neededW;
        targetScale = Math.min(1.0, scaleH, scaleW);
      } else {
        targetScale = manualScaleMultiplier;
      }

      // Apply transform smoothly
      stage.style.transform = `scale(${targetScale})`;
      stage.style.width = `${100 / targetScale}%`;
      stage.style.height = `${100 / targetScale}%`;
    }

    // Render the balanced 5 columns
    function render() {
      const container = document.getElementById('columnsContainer');
      container.innerHTML = '';

      // Create 5 columns
      const cols = [0, 1, 2, 3, 4].map(() => {
        const div = document.createElement('div');
        div.className = 'col-stack';
        return div;
      });

      let matchedWords = 0;
      const q = searchQuery.toLowerCase().trim();

      SECTIONS.forEach(sec => {
        const words = sec.words.filter(w => {
          if (!q) return true;
          return w.el.toLowerCase().includes(q) || w.ru.toLowerCase().includes(q);
        });

        if (words.length === 0) return;
        matchedWords += words.length;

        const card = document.createElement('div');
        card.className = 'vocab-card';

        const header = document.createElement('div');
        header.className = 'vocab-card-header text-slate-800';
        header.innerHTML = `
          <div class="truncate">
            <span class="text-[11px] font-bold text-slate-800">${sec.title}</span>
            <span class="text-[9.5px] text-slate-400 font-normal ml-0.5">(${sec.subtitle})</span>
          </div>
          <span class="text-[9.5px] font-bold px-1 rounded border ${sec.badge}">${words.length}</span>
        `;
        card.appendChild(header);

        const list = document.createElement('div');
        list.className = 'flex flex-col';

        words.forEach(w => {
          const row = document.createElement('div');
          row.className = 'vocab-row group';
          row.onclick = (e) => speak(w.el, e);
          row.title = 'Кликните для озвучки';

          row.innerHTML = `
            <div class="flex items-baseline gap-1 min-w-0">
              <span class="font-semibold text-slate-800 leading-tight">${formatGreek(w.el)}</span>
              <button class="audio-btn opacity-0 group-hover:opacity-100 text-slate-400 hover:text-sky-600 p-0.5" title="Озвучить">
                <svg class="w-2.5 h-2.5 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
                </svg>
              </button>
            </div>
            <div class="ru-translation text-slate-500 text-right shrink-0 font-normal">
              ${w.ru}
            </div>
          `;
          list.appendChild(row);
        });

        card.appendChild(list);
        cols[sec.colIndex].appendChild(card);
      });

      cols.forEach(c => container.appendChild(c));
      document.getElementById('wordCounter').innerText = q ? `${matchedWords} найдено` : '123 слова';

      // Auto-fit after DOM updates
      requestAnimationFrame(fitViewport);
    }

    // Print A4 Function
    function printA4() {
      const wasTest = document.body.classList.contains('test-mode');
      const wasQuery = searchQuery;

      if (wasTest) document.body.classList.remove('test-mode');
      if (wasQuery) {
        searchQuery = '';
        document.getElementById('searchInput').value = '';
        render();
      }

      window.print();

      if (wasTest) document.body.classList.add('test-mode');
      if (wasQuery) {
        searchQuery = wasQuery;
        document.getElementById('searchInput').value = wasQuery;
        render();
      }
    }

    // Search events
    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearSearchBtn');

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      clearBtn.classList.toggle('hidden', !searchQuery);
      render();
    });

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      clearBtn.classList.add('hidden');
      render();
      searchInput.focus();
    });

    // Resize observer to ensure 100vh fit on any window/screen resize
    window.addEventListener('resize', () => {
      fitViewport();
    });

    // Initial render and voice initialization
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    render();
  </script>
</body>
</html>

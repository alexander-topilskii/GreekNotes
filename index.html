<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Греческий язык — Шпаргалки по 20 урокам</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --app-font-size: 11px;
      --app-line-height: 1.25;
      --row-py: 2px;
      --card-gap: 6px;
    }

    /* Desktop mode (>= 1024px): strict 100vh viewport clamp, zero scroll, 5 balanced columns */
    @media (min-width: 1024px) {
      html, body {
        height: 100vh;
        height: 100dvh;
        max-height: 100vh;
        max-height: 100dvh;
        width: 100vw;
        overflow: hidden !important;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      #viewport-container {
        height: calc(100dvh - 38px);
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: flex-start;
        align-items: flex-start;
        padding: 5px;
        box-sizing: border-box;
        position: relative;
      }

      #scale-stage {
        width: 100%;
        height: auto;
        transform-origin: top left;
        display: flex;
        flex-direction: column;
      }

      .sheet-columns {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: var(--card-gap);
        width: 100%;
        height: auto;
        align-items: start;
      }

      .col-stack {
        display: flex;
        flex-direction: column;
        gap: var(--card-gap);
        min-width: 0;
        height: auto;
      }
    }

    /* Mobile & Tablet mode (< 1024px): vertical scrollable "sausage" feed */
    @media (max-width: 1023px) {
      :root {
        --app-font-size: 13.5px;
        --app-line-height: 1.4;
        --row-py: 5.5px;
        --card-gap: 10px;
      }

      html, body {
        height: auto;
        min-height: 100dvh;
        overflow-x: hidden;
        overflow-y: auto !important;
        margin: 0;
        padding: 0;
        -webkit-overflow-scrolling: touch;
      }

      #screen-header {
        position: sticky;
        top: 0;
        height: auto !important;
        max-height: none !important;
        padding: 8px 10px !important;
        flex-wrap: wrap;
      }

      #viewport-container {
        height: auto !important;
        width: 100% !important;
        overflow: visible !important;
        padding: 10px 10px 32px 10px;
        box-sizing: border-box;
      }

      #scale-stage {
        transform: none !important;
        width: 100% !important;
        height: auto !important;
        display: flex;
        flex-direction: column;
      }

      .sheet-columns {
        display: flex;
        flex-direction: column;
        gap: var(--card-gap);
        width: 100%;
      }

      .col-stack {
        display: flex;
        flex-direction: column;
        gap: var(--card-gap);
        width: 100%;
      }

      .vocab-card-header {
        padding: 6px 10px !important;
      }

      .vocab-row {
        padding: var(--row-py) 10px !important;
      }

      .audio-btn {
        opacity: 0.75 !important;
      }
    }

    .vocab-card {
      font-size: var(--app-font-size);
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.03);
      display: flex;
      flex-direction: column;
      overflow: visible;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .vocab-card.ready-lesson {
      border: 1.5px solid #0284c7;
      box-shadow: 0 2px 8px -1px rgba(2, 132, 199, 0.15);
    }

    .vocab-card-header {
      padding: 3px 6px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      border-radius: 4px 4px 0 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      font-weight: 700;
      line-height: 1.2;
      flex-shrink: 0;
    }

    .vocab-card.ready-lesson .vocab-card-header {
      background: #f0f9ff;
      border-bottom: 1px solid #bae6fd;
    }

    .vocab-row {
      padding: var(--row-py) 6px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px;
      line-height: var(--app-line-height);
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
      transition: background-color 0.1s ease;
    }

    .vocab-row:last-child {
      border-bottom: none;
    }

    .vocab-row:hover {
      background-color: #f0f9ff;
    }

    /* Subtle gender-based article coloring */
    .art-neu { color: #0284c7; font-weight: 700; }
    .art-fem { color: #e11d48; font-weight: 700; }
    .art-masc { color: #059669; font-weight: 700; }

    /* Test mode translation blur */
    body.test-mode .ru-translation {
      filter: blur(4.5px);
      transition: filter 0.15s ease;
      cursor: pointer;
    }
    body.test-mode .ru-translation:hover,
    body.test-mode .ru-translation:active {
      filter: blur(0);
    }

    /* Print styles strictly tailored for 1 page A4 landscape */
    @page {
      size: A4 landscape;
      margin: 4mm 5mm;
    }

    @media print {
      html, body {
        height: auto !important;
        overflow: visible !important;
        background: #ffffff !important;
        color: #000000 !important;
        font-size: 7pt !important;
      }

      #screen-header,
      .no-print,
      .audio-btn {
        display: none !important;
      }

      #print-banner {
        display: flex !important;
        justify-content: space-between;
        align-items: baseline;
        border-bottom: 1.2px solid #0f172a;
        padding-bottom: 1px;
        margin-bottom: 3px;
      }

      #viewport-container {
        height: auto !important;
        width: 100% !important;
        padding: 0 !important;
        overflow: visible !important;
      }

      #scale-stage {
        transform: none !important;
        width: 100% !important;
        height: auto !important;
      }

      .sheet-columns {
        display: grid !important;
        grid-template-columns: repeat(5, 1fr) !important;
        gap: 2.5mm !important;
        height: auto !important;
      }

      .vocab-card {
        border: 0.5pt solid #cbd5e1 !important;
        border-radius: 3px !important;
        box-shadow: none !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        font-size: 6.8pt !important;
        margin-bottom: 2mm !important;
      }

      .vocab-card-header {
        background: #f1f5f9 !important;
        padding: 1px 3px !important;
        border-bottom: 0.5pt solid #cbd5e1 !important;
      }

      .vocab-row {
        padding: 0.6px 3px !important;
        border-bottom: 0.5pt solid #f1f5f9 !important;
      }

      .ru-translation {
        filter: none !important;
        color: #334155 !important;
      }
    }
  </style>
</head>

    // State Variables
    let speechRate = 0.9;
    let manualScaleMultiplier = 1.0;
    let isAutoFitActive = true;
    let searchQuery = '';
    const speedCycle = [0.7, 0.9, 1.0];

    // Format Greek articles
    function formatGreek(text) {
      return text.replace(/^(το|τα|η|οι|ο)\s+/i, (match, art) => {
        const lower = art.toLowerCase();
        let cls = 'art-neu';
        if (lower === 'η' || lower === 'οι') cls = 'art-fem';
        else if (lower === 'ο') cls = 'art-masc';
        return `<span class="${cls}">${art}</span> `;
      });
    }

    // Text to Speech
    function speak(text, e) {
      if (e) e.stopPropagation();
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const clean = text.replace(/\(.*?\)/g, '').replace(/\/.*/, '').trim();
      const utter = new SpeechSynthesisUtterance(clean);
      utter.lang = 'el-GR';
      utter.rate = speechRate;
      window.speechSynthesis.speak(utter);
    }

    function cycleSpeed() {
      const idx = speedCycle.indexOf(speechRate);
      speechRate = speedCycle[(idx + 1) % speedCycle.length];
      document.getElementById('speedValue').innerText = speechRate + 'x';
    }

    function toggleTestMode() {
      const isTest = document.body.classList.toggle('test-mode');
      document.getElementById('testIcon').innerText = isTest ? '🙈' : '👁️';
      document.getElementById('testLabel').innerText = isTest ? 'Ответы' : 'Тест';
    }

    function toggleAutoFit() {
      isAutoFitActive = !isAutoFitActive;
      const btn = document.getElementById('autoFitBtn');
      if (isAutoFitActive) {
        btn.className = "hidden lg:flex px-2 py-0.5 rounded text-[11px] font-semibold border border-sky-300 bg-sky-50 text-sky-700 hover:bg-sky-100 items-center gap-1 shadow-2xs cursor-pointer";
        manualScaleMultiplier = 1.0;
      } else {
        btn.className = "hidden lg:flex px-2 py-0.5 rounded text-[11px] font-medium border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 items-center gap-1 cursor-pointer";
      }
      fitViewport();
    }

    function adjustScale(delta) {
      isAutoFitActive = false;
      document.getElementById('autoFitBtn').className = "hidden lg:flex px-2 py-0.5 rounded text-[11px] font-medium border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 items-center gap-1 cursor-pointer";
      manualScaleMultiplier = Math.max(0.65, Math.min(1.35, manualScaleMultiplier + delta));
      fitViewport();
    }

    // Auto-fit Engine for Desktop (>=1024px); disabled on mobile (<1024px) where it scrolls as a sausage
    function fitViewport() {
      const container = document.getElementById('viewport-container');
      const stage = document.getElementById('scale-stage');
      const columnsContainer = document.getElementById('columnsContainer');
      if (!container || !stage || !columnsContainer) return;

      if (window.innerWidth < 1024) {
        stage.style.transform = 'none';
        stage.style.width = '100%';
        stage.style.height = 'auto';
        return;
      }

      stage.style.transform = 'none';
      stage.style.width = '100%';
      stage.style.height = 'auto';

      const availH = container.clientHeight - 10;
      const availW = container.clientWidth - 10;

      if (availH <= 0 || availW <= 0) return;

      if (isAutoFitActive) {
        const naturalH = columnsContainer.offsetHeight;
        if (naturalH > availH) {
          const scale = availH / naturalH;
          stage.style.width = `${100 / scale}%`;
          const adjustedH = columnsContainer.offsetHeight;
          const finalScale = Math.min(1, availH / adjustedH);
          stage.style.width = `${100 / finalScale}%`;
          stage.style.transform = `scale(${finalScale})`;
        } else {
          stage.style.width = '100%';
          stage.style.transform = 'scale(1)';
        }
      } else {
        stage.style.width = `${100 / manualScaleMultiplier}%`;
        stage.style.transform = `scale(${manualScaleMultiplier})`;
      }
    }

    // Render 20 lessons across 5 columns (or single vertical sausage on mobile)
    function render() {
      const container = document.getElementById('columnsContainer');
      container.innerHTML = '';

      const cols = [0, 1, 2, 3, 4].map(() => {
        const div = document.createElement('div');
        div.className = 'col-stack';
        return div;
      });

      let matchedLessons = 0;
      const q = searchQuery.toLowerCase().trim();

      LESSONS.forEach(lesson => {
        const titleMatches = lesson.title.toLowerCase().includes(q) || lesson.subtitle.toLowerCase().includes(q);
        const words = lesson.words.filter(w => {
          if (!q || titleMatches) return true;
          return w.el.toLowerCase().includes(q) || w.ru.toLowerCase().includes(q);
        });

        if (words.length === 0) return;
        matchedLessons++;

        const card = document.createElement('div');
        card.className = `vocab-card ${lesson.ready ? 'ready-lesson' : ''}`;

        const header = document.createElement('div');
        header.className = 'vocab-card-header text-slate-800';

        const actionBtn = lesson.ready
          ? `<a href="${lesson.url}" class="px-1.5 py-0.5 rounded text-[9.5px] font-bold bg-sky-600 hover:bg-sky-700 text-white shadow-2xs transition shrink-0">Открыть 123 сл. →</a>`
          : `<span class="text-[9.5px] font-bold px-1 rounded border ${lesson.badge} shrink-0">Ур. ${lesson.num}</span>`;

        header.innerHTML = `
          <div class="truncate">
            ${lesson.ready ? `<a href="${lesson.url}" class="text-[11px] font-bold text-sky-700 hover:underline">${lesson.title}</a>` : `<span class="text-[11px] font-bold text-slate-800">${lesson.title}</span>`}
            <span class="text-[9.5px] text-slate-500 font-normal ml-0.5">(${lesson.subtitle})</span>
          </div>
          ${actionBtn}
        `;
        card.appendChild(header);

        const list = document.createElement('div');
        list.className = 'flex flex-col';

        words.forEach(w => {
          const row = document.createElement('div');
          row.className = 'vocab-row group';
          row.onclick = (e) => speak(w.el, e);
          row.title = 'Кликните для озвучки';

          row.innerHTML = `
            <div class="flex items-baseline gap-1 min-w-0">
              <span class="font-semibold text-slate-900 leading-tight">${formatGreek(w.el)}</span>
              <button class="audio-btn opacity-0 group-hover:opacity-100 text-slate-400 hover:text-sky-600 p-0.5 shrink-0" title="Озвучить">
                <svg class="w-2.5 h-2.5 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
                </svg>
              </button>
            </div>
            <div class="ru-translation text-slate-600 text-right shrink-0 font-normal">
              ${w.ru}
            </div>
          `;
          list.appendChild(row);
        });

        card.appendChild(list);
        cols[lesson.colIndex].appendChild(card);
      });

      cols.forEach(c => container.appendChild(c));
      document.getElementById('lessonCounter').innerText = q ? `${matchedLessons} ур.` : `20 уроков`;

      requestAnimationFrame(fitViewport);
    }

    // Print A4 Function
    function printA4() {
      const wasTest = document.body.classList.contains('test-mode');
      const wasQuery = searchQuery;

      if (wasTest) document.body.classList.remove('test-mode');
      if (wasQuery) {
        searchQuery = '';
        document.getElementById('searchInput').value = '';
        render();
      }

      window.print();

      if (wasTest) document.body.classList.add('test-mode');
      if (wasQuery) {
        searchQuery = wasQuery;
        document.getElementById('searchInput').value = wasQuery;
        render();
      }
    }

    // Search events
    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearSearchBtn');

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      clearBtn.classList.toggle('hidden', !searchQuery);
      render();
    });

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      clearBtn.classList.add('hidden');
      render();
      searchInput.focus();
    });

    window.addEventListener('resize', () => {
      fitViewport();
    });

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    render();
  </script>

<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Греческий язык — Шпаргалки по 20 урокам</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    @page {
      size: A4 landscape;
      margin: 6mm;
    }

    @media print {
      html, body {
        height: auto !important;
        overflow: visible !important;
        background: #ffffff !important;
      }
      .no-print {
        display: none !important;
      }
      #main-viewport {
        overflow: visible !important;
        padding: 0 !important;
        height: auto !important;
      }
      .lesson-card {
        break-inside: avoid !important;
        page-break-inside: avoid !important;
        box-shadow: none !important;
        border: 1px solid #cbd5e1 !important;
      }
    }

    /* Fallback thin scrollbar for small screens */
    @media (max-width: 1024px) {
      html, body {
        overflow: auto;
      }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 flex flex-col font-sans select-none antialiased">

  <!-- Top Navigation Bar (Light Theme, Compact 42px) -->
  <header class="h-[42px] bg-white border-b border-slate-200 px-4 flex items-center justify-between shrink-0 shadow-2xs z-20">
    <div class="flex items-center gap-2.5">
      <div class="w-7 h-7 rounded-md bg-sky-600 flex items-center justify-center font-extrabold text-xs tracking-wider text-white shadow-xs">
        ΕΛ
      </div>
      <div class="flex items-baseline gap-2">
        <h1 class="font-bold text-sm tracking-tight text-slate-900">
          Греческий язык — Навигатор уроков
        </h1>
        <span class="hidden sm:inline-block text-[11px] font-semibold px-2 py-0.5 rounded-full bg-sky-50 text-sky-700 border border-sky-200">
          20 уроков • Ключевые слова и фразы
        </span>
      </div>
    </div>

    <div class="flex items-center gap-2.5 no-print">
      <a
        href="lessons/lesson_11.html"
        class="hidden md:flex items-center gap-1.5 text-xs font-semibold text-sky-700 bg-sky-50 hover:bg-sky-100 px-2.5 py-1 rounded border border-sky-200 transition"
      >
        <span class="w-2 h-2 rounded-full bg-sky-600"></span>
        <span>Урок 11: Квартиры (123 слова) →</span>
      </a>

      <button
        onclick="window.print()"
        title="Распечатать список всех 20 уроков на формате А4"
        class="flex items-center gap-1.5 px-3 py-1 rounded bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs shadow-2xs transition cursor-pointer"
      >
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path>
        </svg>
        <span>Печать А4</span>
      </button>
    </div>
  </header>

  <!-- Main Viewport: 5x4 Grid fitting 100% of remaining viewport height on desktop -->
  <main id="main-viewport" class="flex-1 p-2.5 overflow-y-auto lg:overflow-hidden flex flex-col">
    <div id="lessonsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 lg:grid-cols-5 lg:grid-rows-4 gap-2.5 w-full h-full">
      <!-- Populated by JS -->
    </div>
  </main>

  <script>
    const LESSONS = [
      {
        num: 1,
        theme: "Знакомство и приветствие",
        elTitle: "Γεια σας!",
        words: ["Γεια σας / Γεια σου", "Πώς σε λένε;", "Είμαι ο/η...", "Από πού είσαι;", "Χάρηκα πολύ", "Καλημέρα / Καλησπέρα"],
        ready: false
      },
      {
        num: 2,
        theme: "Где ты живёшь? Город и адрес",
        elTitle: "Πού μένεις;",
        words: ["Πού μένεις;", "Μένω στην Αθήνα", "η οδός / ο αριθμός", "το κέντρο", "το τηλέφωνο", "κοντά / μακριά"],
        ready: false
      },
      {
        num: 3,
        theme: "Профессии, работа и семья",
        elTitle: "Τι δουλειά κάνεις;",
        words: ["Τι δουλειά κάνεις;", "Είμαι γιατρός / δάσκαλος", "δουλεύω σε...", "ο άντρας / η γυναίκα", "τα παιδιά", "παντρεμένος / ελεύθερος"],
        ready: false
      },
      {
        num: 4,
        theme: "Языки и национальности",
        elTitle: "Μιλάς ελληνικά;",
        words: ["Μιλάς ελληνικά;", "Μιλάω λίγο", "Δεν καταλαβαίνω", "Πώς το λένε στα ελληνικά;", "Ξέρεις τον/την...;", "η γλώσσα"],
        ready: false
      },
      {
        num: 5,
        theme: "Повторение 1–4: О себе",
        elTitle: "Πάμε πάλι! (1)",
        words: ["Χαιρετισμοί", "Προσωπικά στοιχεία", "Εθνικότητες", "Επαγγέλματα", "Αριθμοί 1–100", "Το ρήμα είμαι / μένω"],
        ready: false
      },
      {
        num: 6,
        theme: "Транспорт, маршрут и время",
        elTitle: "Πού πάτε;",
        words: ["Πού πάτε;", "Πάω με το λεωφορείο", "Τι ώρα είναι;", "Θέλω ένα εισιτήριο", "Πόσο κάνει;", "με τα πόδια / με το μετρό"],
        ready: false
      },
      {
        num: 7,
        theme: "Дни недели, погода и рутина",
        elTitle: "Ποτέ την Κυριακή",
        words: ["Δευτέρα – Κυριακή", "Κάνει ζέστη / κρύο", "Πόσον καιρό είσαι εδώ;", "κάθε μέρα / ποτέ", "ακούω, τρώω, λέω", "Οι μήνες & οι εποχές"],
        ready: false
      },
      {
        num: 8,
        theme: "Кафе, таверна, еда и заказ",
        elTitle: "Πόσο κάνουν όλα;",
        words: ["Τι θέλετε, παρακαλώ;", "Θα ήθελα έναν καφέ", "Πόσο κάνουν όλα;", "Τον λογαριασμό", "το ψωμί / το νερό", "σκέτος / μέτριος / γλυκός"],
        ready: false
      },
      {
        num: 9,
        theme: "Покупки, одежда и цвета",
        elTitle: "Πάμε για ψώνια;",
        words: ["Πόσο κοστίζει;", "Μου αρέσει / μου κάνει", "τα ρούχα & τα παπούτσια", "μεγάλο / μικρό νούμερο", "μετρητά ή κάρτα;", "τα χρώματα"],
        ready: false
      },
      {
        num: 10,
        theme: "Повторение 6–9: Город и покупки",
        elTitle: "Πάμε πάλι! (2)",
        words: ["Ώρα & πρόγραμμα", "Στο καφενείο / εστιατόριο", "Στο κατάστημα", "Αριθμοί 100–1000", "Αιτιατική πτώση", "Καθημερινές φράσεις"],
        ready: false
      },
      {
        num: 11,
        theme: "Квартиры, аренда и город",
        elTitle: "Ψάχνω για σπίτι",
        words: ["το διαμέρισμα / το σπίτι", "το ενοίκιο & τα κοινόχρηστα", "ο όροφος / το ισόγειο", "το σαλόνι, η κουζίνα, το μπάνιο", "έπιπλα & συσκευές", "δίπλα σε / απέναντι από"],
        url: "lessons/lesson_11.html",
        ready: true
      },
      {
        num: 12,
        theme: "Путешествие и прошедшее время",
        elTitle: "Ένα ταξίδι",
        words: ["Πού ήσουν το Σαββατοκύριακο;", "Πώς περάσατε χτες;", "ταξίδεψα / πήγα", "το ξενοδοχείο / το νησί", "το αεροπλάνο / το πλοίο", "χτες, προχτές, πέρυσι"],
        ready: false
      },
      {
        num: 13,
        theme: "Биография, события и праздники",
        elTitle: "Η ιστορία της ζωής μου",
        words: ["Γεννήθηκα στην...", "Μεγάλωσα / σπούδασα", "Ήρθα στην Ελλάδα", "Χρόνια πολλά! Να ζήσεις!", "η γιορτή / τα γενέθλια", "παντρεύτηκα / βρήκα δουλειά"],
        ready: false
      },
      {
        num: 14,
        theme: "Планы на будущее и меню",
        elTitle: "Τι θα κάνουμε;",
        words: ["Τι θα κάνουμε το βράδυ;", "Θα σας πω κάτι", "Τι θα πάρετε / πιούμε;", "τον άλλο μήνα / αύριο", "το ορεκτικό / το κυρίως πιάτο", "Στην ταβέρνα"],
        ready: false
      },
      {
        num: 15,
        theme: "Повторение 11–14: Времена глаголов",
        elTitle: "Πάμε πάλι! (3)",
        words: ["Αόριστος (прошедшее)", "Μέλλοντας (будущее)", "Περιγραφή σπιτιού", "Αφήγηση γεγονότων", "Σύγκριση (πιο... από)", "Ρήματα Γ2 (θυμάμαι, κοιμάμαι)"],
        ready: false
      },
      {
        num: 16,
        theme: "Досуг, кино и приглашения",
        elTitle: "Πάμε βόλτα;",
        words: ["Πάμε να πιούμε καφέ;", "Θέλετε να δούμε ταινία;", "το σινεμά / το θέατρο", "Αποφάσισα να...", "Μπορώ να έρθω;", "ελεύθερος χρόνος"],
        ready: false
      },
      {
        num: 17,
        theme: "Поиск работы и резюме",
        elTitle: "Πάμε για δουλειά",
        words: ["Τηλεφωνώ για την αγγελία", "Έχετε εμπειρία;", "το βιογραφικό", "ο μισθός & το ωράριο", "πλήρης / μερική απασχόληση", "η συνέντευξη"],
        ready: false
      },
      {
        num: 18,
        theme: "У врача, здоровье и аптека",
        elTitle: "Στον γιατρό",
        words: ["Τι έχετε; Πονάει ο λαιμός μου", "Έχω πυρετό / βήχα", "Περαστικά!", "το φάρμακο / η συνταγή", "το ραντεβού με τον γιατρό", "τα μέρη του σώματος"],
        ready: false
      },
      {
        num: 19,
        theme: "Услуги: почта, банк и очередь",
        elTitle: "Περιμένετε στην ουρά!",
        words: ["Περιμένετε στην ουρά, παρακαλώ!", "το ταχυδρομείο / το δέμα", "η τράπεζα / ο λογαριασμός", "υπογράψτε εδώ", "η ταυτότητα / το διαβατήριο", "Προστακτική (повелительное)"],
        ready: false
      },
      {
        num: 20,
        theme: "Итоговое повторение курса А1",
        elTitle: "Πάμε πάλι! (4)",
        words: ["Όλοι οι χρόνοι ρημάτων", "Καθημερινή επικοινωνία", "Σπίτι, πόλη & υπηρεσίες", "Υγεία & εργασία", "Προθέσεις & αντωνυμίες", "Έτοιμοι για το Α2!"],
        ready: false
      }
    ];

    const grid = document.getElementById('lessonsGrid');

    LESSONS.forEach(lesson => {
      const el = document.createElement(lesson.ready ? 'a' : 'div');
      if (lesson.ready) {
        el.href = lesson.url;
      }

      el.className = `lesson-card group relative flex flex-col justify-between p-2.5 rounded-lg border transition-all ${
        lesson.ready
          ? 'bg-white border-2 border-sky-500 shadow-sm hover:shadow-md hover:border-sky-600 hover:bg-sky-50/30 cursor-pointer ring-2 ring-sky-500/10'
          : 'bg-white border-slate-200 hover:border-slate-300 shadow-2xs'
      }`;

      const badgeHtml = lesson.ready
        ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-sky-600 text-white shadow-2xs group-hover:bg-sky-700 transition">Открыть шпаргалку →</span>`
        : `<span class="px-1.5 py-0.5 rounded text-[10px] font-medium bg-slate-100 text-slate-500 border border-slate-200">Урок ${lesson.num}</span>`;

      const wordsListHtml = lesson.words.map(w => `
        <span class="inline-block text-[10.5px] leading-snug px-1.5 py-0.5 rounded ${
          lesson.ready
            ? 'bg-sky-50 text-sky-900 border border-sky-200/80 font-medium'
            : 'bg-slate-50 text-slate-600 border border-slate-200/60'
        }">${w}</span>
      `).join('');

      el.innerHTML = `
        <div>
          <!-- Card Header -->
          <div class="flex items-center justify-between gap-1.5 mb-1">
            <div class="flex items-center gap-1.5 min-w-0">
              <span class="w-5 h-5 rounded flex items-center justify-center font-extrabold text-[11px] shrink-0 ${
                lesson.ready ? 'bg-sky-600 text-white' : 'bg-slate-200 text-slate-700'
              }">
                ${lesson.num}
              </span>
              <span class="text-[11px] font-bold text-sky-700 truncate">${lesson.elTitle}</span>
            </div>
            ${badgeHtml}
          </div>

          <!-- Russian Theme Title -->
          <h2 class="font-bold text-xs md:text-[13px] text-slate-900 leading-tight mb-1.5">
            ${lesson.theme}
          </h2>
        </div>

        <!-- Key Words & Phrases for Repetition -->
        <div class="pt-1.5 border-t border-slate-100 flex flex-wrap gap-1 content-start">
          ${wordsListHtml}
        </div>
      `;

      grid.appendChild(el);
    });
  </script>
</body>
</html>
